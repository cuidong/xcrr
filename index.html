<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素画展示器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 15px;
        }

        #pixelCanvas {
            border: 3px solid #333;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .preset-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .preset-color {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .preset-color:hover {
            transform: scale(1.1);
            border-color: #333;
        }

        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 像素画创作器</h1>
        
        <div class="controls">
            <div class="color-picker">
                <label>颜色：</label>
                <input type="color" id="colorPicker" value="#000000">
            </div>
            <button onclick="clearCanvas()">清空画布</button>
            <button onclick="downloadImage()">下载作品</button>
        </div>

        <div class="preset-colors">
            <div class="preset-color" style="background: #000000" onclick="selectColor('#000000')"></div>
            <div class="preset-color" style="background: #ffffff; border: 1px solid #ddd" onclick="selectColor('#ffffff')"></div>
            <div class="preset-color" style="background: #ff0000" onclick="selectColor('#ff0000')"></div>
            <div class="preset-color" style="background: #00ff00" onclick="selectColor('#00ff00')"></div>
            <div class="preset-color" style="background: #0000ff" onclick="selectColor('#0000ff')"></div>
            <div class="preset-color" style="background: #ffff00" onclick="selectColor('#ffff00')"></div>
            <div class="preset-color" style="background: #ff00ff" onclick="selectColor('#ff00ff')"></div>
            <div class="preset-color" style="background: #00ffff" onclick="selectColor('#00ffff')"></div>
            <div class="preset-color" style="background: #ffa500" onclick="selectColor('#ffa500')"></div>
            <div class="preset-color" style="background: #800080" onclick="selectColor('#800080')"></div>
        </div>

        <div class="canvas-container">
            <canvas id="pixelCanvas"></canvas>
        </div>

        <div class="info">
            💡 提示：点击画布绘制像素画，按住鼠标拖动可连续绘制
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        
        const gridSize = 32;
        const pixelSize = 15;
        canvas.width = gridSize * pixelSize;
        canvas.height = gridSize * pixelSize;

        let isDrawing = false;
        let currentColor = '#000000';

        // 初始化画布
        function initCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        // 绘制网格
        function drawGrid() {
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * pixelSize, 0);
                ctx.lineTo(i * pixelSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * pixelSize);
                ctx.lineTo(canvas.width, i * pixelSize);
                ctx.stroke();
            }
        }

        // 绘制像素
        function drawPixel(x, y) {
            const gridX = Math.floor(x / pixelSize);
            const gridY = Math.floor(y / pixelSize);
            
            ctx.fillStyle = currentColor;
            ctx.fillRect(gridX * pixelSize, gridY * pixelSize, pixelSize, pixelSize);
            drawGrid();
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            drawPixel(x, y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                drawPixel(x, y);
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        // 触摸事件支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            drawPixel(x, y);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDrawing) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                drawPixel(x, y);
            }
        });

        canvas.addEventListener('touchend', () => {
            isDrawing = false;
        });

        // 颜色选择
        colorPicker.addEventListener('change', (e) => {
            currentColor = e.target.value;
        });

        function selectColor(color) {
            currentColor = color;
            colorPicker.value = color;
        }

        // 清空画布
        function clearCanvas() {
            initCanvas();
        }

        // 下载图片
        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // 初始化
        initCanvas();
    </script>
</body>
</html>
